[pytest]
addopts = --cov --cov-report=term-missing:skip-covered --cov-fail-under=80
pythonpath =
  gnani_client
  backend
  benchmark
testpaths =
  gnani_client/tests
  backend/tests
  benchmark/tests
  scripts/tests

markers =
    live: optional live LLM call; skips when the provider key is absent
