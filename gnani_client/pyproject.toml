[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnani-client"
version = "0.1.0"
description = "Thin clients for Gnani Prisma STT and Timbre TTS on api.vachana.ai"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gnani_client*"]
