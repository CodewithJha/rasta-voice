name: Task
description: A slice of planned work, in the same shape as docs/issues.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Fill this the way the files in `docs/issues/` are written, so the work can be reviewed and tested."
  - type: input
    id: labels
    attributes:
      label: Labels
      description: Extra labels beyond the template default, for example area:app, day:2, api.
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      options:
        - "Member A: Himanshu (@himanshu748), benchmark and audio"
        - "Member B: Prakhar (@CodewithJha), app, realtime, and UI"
        - Both (split in the description; still only these two people)
    validations:
      required: true
  - type: input
    id: day
    attributes:
      label: Target day
      description: Day 1, Day 2, Day 3, or post-contest, plus a date if you know it.
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers or "skeleton".
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What to build, and what not to do. Name the contracts you must not break.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files to touch
    validations:
      required: true
  - type: textarea
    id: do_not_touch
    attributes:
      label: Do not touch
      description: Trees or frozen files that belong to the other person or to a shared contract.
  - type: textarea
    id: contract
    attributes:
      label: Input / output contract
      description: Request and response shapes, commands, or file formats.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkboxes that a reviewer can tick. Be specific and testable.
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: How to test
      description: Commands and a short manual path. No secrets in the examples.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: Synthetic data only, and no secrets in the issue text.
          required: true
        - label: App code will call real Gnani APIs only. Tests may use httpx.MockTransport inside the test file, never a mock flag in the app.
          required: true
