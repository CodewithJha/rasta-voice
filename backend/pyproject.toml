[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rasta-backend"
version = "0.1.0"
description = "Rasta Voice API: noisy rider audio in, a dispatch event out"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "uvicorn>=0.32",
  "mutagen>=1.48.1,<2",
  "starlette>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rasta*"]
