<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-labelledby="rasta-logo-title rasta-logo-desc">
  <title id="rasta-logo-title">Rasta Voice</title>
  <desc id="rasta-logo-desc">Wordmark and mark for Rasta Voice, a Hinglish dispatch copilot for delivery riders.</desc>
  <defs>
    <linearGradient id="mark-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c45c26"/>
      <stop offset="100%" stop-color="#8a3414"/>
    </linearGradient>
  </defs>
  <!-- Mark: radio-horn badge -->
  <rect x="8" y="24" width="112" height="112" rx="28" fill="url(#mark-fill)"/>
  <circle cx="64" cy="80" r="34" fill="none" stroke="#f7f1e8" stroke-width="5"/>
  <circle cx="64" cy="80" r="14" fill="#f7f1e8"/>
  <path d="M86 56c18 10 28 26 28 40s-10 30-28 40" fill="none" stroke="#f7f1e8" stroke-width="5" stroke-linecap="round"/>
  <path d="M98 48c24 14 38 34 38 48s-14 34-38 48" fill="none" stroke="#f7f1e8" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <!-- Wordmark -->
  <text x="148" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1c1917" letter-spacing="-1.5">Rasta</text>
  <text x="340" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="400" fill="#c45c26" letter-spacing="-1">Voice</text>
  <text x="148" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="500" fill="#57534e" letter-spacing="0.22em">HINGLISH DISPATCH COPILOT</text>
</svg>
