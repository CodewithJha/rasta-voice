<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rasta-arch-title rasta-arch-desc">
        <title id="rasta-arch-title">Rasta Voice runtime architecture</title>
        <desc id="rasta-arch-desc">Rider audio enters FastAPI, Prisma transcribes, the extractor validates a RiderEvent into SQLite, the dispatch slate polls it, and Timbre speaks a state-aware confirmation.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c45c26"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/></marker>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.08)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f7f1e8"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zones -->
        <rect x="40" y="40" width="200" height="488" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
        <rect x="36" y="36" width="72" height="18" rx="2" fill="#f7f1e8"/>
        <text x="44" y="49" font-family="Geist Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="#57534e" letter-spacing="0.12em">PUBLIC</text>

        <rect x="280" y="40" width="320" height="488" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
        <rect x="276" y="36" width="92" height="18" rx="2" fill="#f7f1e8"/>
        <text x="284" y="49" font-family="Geist Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="#57534e" letter-spacing="0.12em">API HOST</text>

        <rect x="720" y="40" width="200" height="488" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
        <rect x="716" y="36" width="108" height="18" rx="2" fill="#f7f1e8"/>
        <text x="724" y="49" font-family="Geist Mono, ui-monospace, monospace" font-size="11" font-weight="500" fill="#57534e" letter-spacing="0.12em">PROVIDERS</text>

        <!-- Arrows first (behind nodes). All ports land on box edges. -->
        <!-- Rider → FastAPI -->
        <path d="M 220,140 H 320" fill="none" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="244" y="124" width="52" height="14" fill="#f7f1e8"/>
        <text x="270" y="135" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#1d4ed8">UPLOAD</text>

        <!-- FastAPI → Prisma (straight into left edge) -->
        <path d="M 560,140 H 740" fill="none" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="628" y="124" width="36" height="14" fill="#f7f1e8"/>
        <text x="646" y="135" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#1d4ed8">STT</text>

        <!-- Prisma → Extractor (down then left into right edge) -->
        <path d="M 820,172 V 276 H 560" fill="none" stroke="#57534e" stroke-width="1.4" marker-end="url(#arrow)"/>
        <rect x="780" y="212" width="40" height="14" fill="#f7f1e8"/>
        <text x="800" y="223" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#57534e">TEXT</text>

        <!-- Extractor → SQLite -->
        <path d="M 440,308 V 348" fill="none" stroke="#c45c26" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
        <rect x="412" y="318" width="48" height="14" fill="#f7f1e8"/>
        <text x="436" y="329" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#c45c26">EVENT</text>

        <!-- SQLite → Desk (POLL) -->
        <path d="M 320,380 H 220" fill="none" stroke="#57534e" stroke-width="1.4" marker-end="url(#arrow)"/>
        <rect x="248" y="364" width="40" height="14" fill="#f7f1e8"/>
        <text x="268" y="375" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#57534e">POLL</text>

        <!-- Desk → FastAPI (ACK) via public/API gutter -->
        <path d="M 220,380 H 260 V 140 H 320" fill="none" stroke="#57534e" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="242" y="248" width="36" height="14" fill="#f7f1e8"/>
        <text x="260" y="259" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#57534e">ACK</text>

        <!-- Confirm → Reply -->
        <path d="M 220,484 H 320" fill="none" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="244" y="468" width="40" height="14" fill="#f7f1e8"/>
        <text x="264" y="479" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#1d4ed8">HEAR</text>

        <!-- Reply → Timbre -->
        <path d="M 560,484 H 740" fill="none" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="628" y="468" width="36" height="14" fill="#f7f1e8"/>
        <text x="646" y="479" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#1d4ed8">TTS</text>

        <!-- PUBLIC nodes -->
        <rect x="60" y="108" width="160" height="64" rx="6" fill="#f7f1e8" stroke="#1c1917" stroke-width="1.4"/>
        <rect x="60" y="108" width="52" height="16" rx="2" fill="#1c1917"/>
        <text x="68" y="120" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#f7f1e8">RIDER</text>
        <text x="76" y="144" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c1917">Rider chit</text>
        <text x="76" y="162" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">mic · upload · sample</text>

        <rect x="60" y="348" width="160" height="64" rx="6" fill="#f7f1e8" stroke="#1c1917" stroke-width="1.4"/>
        <rect x="60" y="348" width="44" height="16" rx="2" fill="#1c1917"/>
        <text x="68" y="360" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#f7f1e8">DESK</text>
        <text x="76" y="384" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c1917">Dispatch slate</text>
        <text x="76" y="402" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">ack · resolve · CSRF</text>

        <rect x="60" y="452" width="160" height="64" rx="6" fill="#f7f1e8" stroke="#1c1917" stroke-width="1.4"/>
        <rect x="60" y="452" width="56" height="16" rx="2" fill="#1c1917"/>
        <text x="68" y="464" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#f7f1e8">AUDIO</text>
        <text x="76" y="488" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c1917">Confirmation</text>
        <text x="76" y="506" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">state-aware reply</text>

        <!-- API nodes -->
        <rect x="320" y="108" width="240" height="64" rx="6" fill="#f7f1e8" stroke="#1c1917" stroke-width="1.4"/>
        <rect x="320" y="108" width="56" height="16" rx="2" fill="#1c1917"/>
        <text x="328" y="120" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#f7f1e8">EDGE</text>
        <text x="336" y="144" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c1917">FastAPI</text>
        <text x="336" y="162" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">one worker · budgets</text>

        <rect x="320" y="244" width="240" height="64" rx="6" fill="rgba(196,92,38,0.08)" stroke="#c45c26" stroke-width="1.8"/>
        <rect x="320" y="244" width="72" height="16" rx="2" fill="#c45c26"/>
        <text x="328" y="256" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#f7f1e8">FOCAL</text>
        <text x="336" y="280" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c1917">Extractor</text>
        <text x="336" y="298" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">rules · groq · gemini</text>

        <rect x="320" y="348" width="240" height="64" rx="6" fill="#f7f1e8" stroke="#1c1917" stroke-width="1.4"/>
        <rect x="320" y="348" width="56" height="16" rx="2" fill="#1c1917"/>
        <text x="328" y="360" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#f7f1e8">STORE</text>
        <text x="336" y="384" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c1917">SQLite events</text>
        <text x="336" y="402" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">redact · retain · delete</text>

        <rect x="320" y="452" width="240" height="64" rx="6" fill="#f7f1e8" stroke="#1c1917" stroke-width="1.4"/>
        <rect x="320" y="452" width="56" height="16" rx="2" fill="#1c1917"/>
        <text x="328" y="464" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#f7f1e8">REPLY</text>
        <text x="336" y="488" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c1917">Reply route</text>
        <text x="336" y="506" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">template · cache · Timbre</text>

        <!-- Providers -->
        <rect x="740" y="108" width="160" height="64" rx="6" fill="#f7f1e8" stroke="rgba(28,25,23,0.35)" stroke-width="1.2" stroke-dasharray="4,3"/>
        <rect x="740" y="108" width="56" height="16" rx="2" fill="#57534e"/>
        <text x="748" y="120" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#f7f1e8">STT</text>
        <text x="756" y="144" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c1917">Gnani Prisma</text>
        <text x="756" y="162" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">v3 · transliterate</text>

        <rect x="740" y="452" width="160" height="64" rx="6" fill="#f7f1e8" stroke="rgba(28,25,23,0.35)" stroke-width="1.2" stroke-dasharray="4,3"/>
        <rect x="740" y="452" width="56" height="16" rx="2" fill="#57534e"/>
        <text x="748" y="464" font-family="Geist Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="#f7f1e8">TTS</text>
        <text x="756" y="488" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c1917">Gnani Timbre</text>
        <text x="756" y="506" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">Shivani · hi-en</text>

        <!-- Legend -->
        <line x1="40" y1="544" x2="920" y2="544" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
        <rect x="40" y="554" width="14" height="10" rx="2" fill="rgba(196,92,38,0.08)" stroke="#c45c26" stroke-width="1.4"/>
        <text x="62" y="563" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">extractor (focal)</text>
        <rect x="220" y="554" width="14" height="10" rx="2" fill="#f7f1e8" stroke="#1c1917" stroke-width="1.2"/>
        <text x="242" y="563" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">app surface</text>
        <rect x="380" y="554" width="14" height="10" rx="2" fill="#f7f1e8" stroke="rgba(28,25,23,0.35)" stroke-width="1.2" stroke-dasharray="3,2"/>
        <text x="402" y="563" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">external speech API</text>
        <line x1="580" y1="559" x2="610" y2="559" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <text x="620" y="563" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">provider call</text>
        <line x1="760" y1="559" x2="790" y2="559" stroke="#c45c26" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <text x="800" y="563" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#57534e">validated event</text>
      </svg>
